# Application name
spring.application.name=EMPLOYEE-SERVICE

# Server port (Uncomment if you want to set explicitly)
# server.port=8081

# Oracle DB Configuration (Uncomment to enable)
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521/ORCL
# spring.datasource.username=rudradb
# spring.datasource.password=rudradb
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# spring.jpa.hibernate.ddl-auto=update

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# zipkin (Uncomment if you're using distributed tracing)
# spring.zipkin.base-url=http://127.0.0.1:9411/

# Config Server Import
spring.config.import=optional:configserver:http://localhost:8888

# Expose all Actuator end-points
management.endpoints.web.exposure.include=*

#actuator end-points for circuit breaker
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

# circuit breaker configuration 
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.failureRateThreshold=50
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.slidingWindowSize=10
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.slidingWindowType=COUNT_BASED

#for retry configuration
resilience4j.retry.instances.EMPLOYEE-SERVICE.registerHealthIndicator=true
resilience4j.retry.instances.EMPLOYEE-SERVICE.max-attempts=5
resilience4j.retry.instances.EMPLOYEE-SERVICE.wait-duration=1s